[project]
name = "gies-bot"
version = "0.1.0"
description = "Monitor for the GIES classroom prediction market: fair values, edges, ntfy alerts"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gies_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
